services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: uacohio
      MARIADB_USER: uacohio
      MARIADB_PASSWORD: uacohio-local-only
      MARIADB_ROOT_PASSWORD: root-local-only
    ports:
      - "3306:3306"
    volumes:
      - uacohio_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  uacohio_mariadb:
